<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KD Farm and Garden LLC</title>
<meta name="description" content="KD Farm and Garden LLC builds iPhone and iPad apps.">
<style>
  :root { --bg:#fbfaf6; --text:#1f2a1f; --muted:#5b665b; --accent:#2f7d4a; --line:#e3e6dc; }
  @media (prefers-color-scheme: dark) { :root { --bg:#141a14; --text:#eef2ea; --muted:#a9b3a6; --accent:#6cc48a; --line:#2a332a; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 72px 20px 48px; }
  h1 { font-size: 2rem; line-height:1.2; margin:0 0 12px; }
  p { margin: 0 0 16px; }
  .muted { color: var(--muted); }
  a { color: var(--accent); }
  footer { border-top:1px solid var(--line); margin-top:48px; padding-top:20px; font-size:15px; color:var(--muted); }
  footer a { margin-right: 16px; }
  h2 { font-size: 1.2rem; margin-top: 32px; }
  ul { padding-left: 20px; }
</style>
</head>
<body>
<main>
  <h1>KD Farm and Garden LLC</h1>
  <p>We build iPhone and iPad apps: practical tools for people who work on homes, and simple, colorful games for families.</p>
  <p class="muted">A small Texas software studio.</p>
  <p>Contact: <a href="mailto:hello@kdfarmandgarden.com">hello@kdfarmandgarden.com</a></p>
  <footer>
    <a href="/support/">Support</a><a href="/contact/">Contact</a>
    <span>© 2026 KD Farm and Garden LLC, Texas</span>
  </footer>
</main>
</body>
</html>
